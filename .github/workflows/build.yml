name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build APK via Capacitor
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init RideLead com.ridelead.app --web-dir www
          npx cap add android
          
          mkdir -p android/app/src/main/java/com/ridelead/app
          cp -r android-custom/java/com/ridelead/app/* android/app/src/main/java/com/ridelead/app/
          
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
