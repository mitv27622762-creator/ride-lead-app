<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideLead Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #f5f5f5; padding: 16px; }
    h2 { margin-bottom: 16px; font-size: 20px; color: #25d366; text-align: center; }
    
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .badge { background: #25d366; color: #000; font-weight: bold; font-size: 12px; padding: 4px 8px; border-radius: 4px; }
    
    .route { font-size: 15px; margin-bottom: 12px; line-height: 1.4; }
    .route span { color: #888; }
    
    .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; text-align: center; }
    .metrics div strong { display: block; color: #25d366; margin-top: 2px; }

    .actions { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    
    .btn-accept { background: #25d366; color: #000; }
    .btn-open { background: #2196f3; color: #fff; }
    .btn-reject { background: #333; color: #ff5252; border: 1px solid #ff5252; }
  </style>
</head>
<body>

  <h2>Live Ride Leads</h2>
  <div id="leadsContainer"></div>

  <script>
    function addIncomingLead(leadData) {
      let lead = typeof leadData === 'string' ? JSON.parse(leadData) : leadData;
      createLeadCard(lead);
    }

    function createLeadCard(lead) {
      const container = document.getElementById('leadsContainer');
      const card = document.createElement('div');
      card.className = 'card';
      const leadId = lead.id || Date.now();
      card.id = `lead-${leadId}`;

      let timeLeft = 10;

      card.innerHTML = `
        <div class="header">
          <span class="badge">${lead.groupName || 'WhatsApp Lead'}</span>
          <small style="color:#aaa;">Just now</small>
        </div>

        <div class="route">
          <div><span>Pickup:</span> <strong>${lead.pickup || 'Not specified'}</strong></div>
          <div><span>Drop:</span> <strong>${lead.drop || 'Not specified'}</strong></div>
        </div>

        <div class="metrics">
          <div>Distance<strong>${lead.km ? lead.km + ' KM' : 'N/A'}</strong></div>
          <div>Toll<strong>${lead.toll || 'N/A'}</strong></div>
          <div>Parking<strong>${lead.parking || 'N/A'}</strong></div>
        </div>

        <div class="actions">
          <button class="btn-accept" id="btn-main-${leadId}">Accept (${timeLeft}s)</button>
          <button class="btn-reject" onclick="rejectLead('${leadId}')">Reject</button>
        </div>
      `;

      container.prepend(card);

      const mainBtn = card.querySelector(`#btn-main-${leadId}`);

      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          mainBtn.innerText = `Accept (${timeLeft}s)`;
        } else {
          clearInterval(countdown);
          mainBtn.className = 'btn-open';
          mainBtn.innerText = 'Open Chat';
          mainBtn.onclick = () => openWhatsAppChat(lead.phone, false);
        }
      }, 1000);

      mainBtn.onclick = () => {
        clearInterval(countdown);
        openWhatsAppChat(lead.phone, true);
      };
    }

    function openWhatsAppChat(phone, autoFill) {
      const message = autoFill ? "?text=" + encodeURIComponent("Okay 👍") : "";
      const cleanPhone = phone ? phone.replace(/[^0-9]/g, '') : '';
      window.location.href = `https://api.whatsapp.com/send?phone=${cleanPhone}${message}`;
    }

    function rejectLead(id) {
      const card = document.getElementById(`lead-${id}`);
      if (card) card.remove();
    }
  </script>
</body>
</html>
